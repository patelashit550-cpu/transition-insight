name: Deploy to GitHub Pages

# Caller workflow. Shared Node install is the setup-node composite action.
# Never build/export from a non-main ref (workflow_dispatch can target any branch).
#
# ashitmilne.xyz DNS already points at GitHub Pages. The site 404s when this
# job skips upload — do not fail the build on a GitHub audit of Pages source.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # workflow_dispatch can target any ref; never build/export from a non-main branch.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: ./.github/actions/setup-node

      - name: Switch GitHub Pages source to GitHub Actions
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/enable-github-pages.mjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build static export (global tier)
        # Live origin is GitHub Pages until SNS IPFS + sol.site DNSLink are set.
        env:
          NEXT_PUBLIC_SITE_URL: https://ashitmilne.xyz
        run: npm run build:global

      - name: Pin signed attestation to export
        # build:global regenerates an unsigned manifest; deploy the committed signed copy instead.
        run: |
          git checkout HEAD -- public/attestation.json public/.well-known/provenance.json
          node scripts/sync-export-attestation.mjs --strict --verify

      - name: Audit export perimeter
        env:
          NEXT_PUBLIC_SITE_URL: https://ashitmilne.xyz
        run: node scripts/audit-perimeter.mjs --export

      - name: Audit GitHub Pages source
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/audit-perimeter.mjs --github

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
