name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build static export (global tier)
        # Serving at custom domain root (ashitmilne.xyz) → no basePath.
        # Absolute /_next/ asset paths are correct for a root-domain deploy.
        # Set the canonical origin explicitly so both Next.js and the standalone
        # discovery scripts (sitemap, provenance, agent-skills) agree on the domain.
        env:
          NEXT_PUBLIC_SITE_URL: https://ashitmilne.xyz
        run: npm run build:global

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
