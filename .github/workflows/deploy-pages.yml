name: Deploy to GitHub Pages

# Caller workflow. Shared Node install is the setup-node composite action.
# Never build/export from a non-main ref (workflow_dispatch can target any branch).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # workflow_dispatch can target any ref; never build/export from a non-main branch.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: ./.github/actions/setup-node

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build static export (global tier)
        # Serving at custom domain root (ashitmilne.xyz) → no basePath.
        # Absolute /_next/ asset paths are correct for a root-domain deploy.
        # Set the canonical origin explicitly so both Next.js and the standalone
        # discovery scripts (sitemap, provenance, agent-skills) agree on the domain.
        env:
          NEXT_PUBLIC_SITE_URL: https://ashitmilne.xyz
        run: npm run build:global

      - name: Audit export perimeter
        env:
          NEXT_PUBLIC_SITE_URL: https://ashitmilne.xyz
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/audit-perimeter.mjs --export --github

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
